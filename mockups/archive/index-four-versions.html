<div class="stage">
  <header class="mock-bar" aria-label="Настройки макета">
    <div class="mb-group">
      <span class="mb-label" id="mb-variant">Версия</span>
      <div class="seg-mini" role="group" aria-labelledby="mb-variant" id="variant-seg"></div>
    </div>
    <div class="mb-group">
      <span class="mb-label" id="mb-viewer">Смотрю как</span>
      <div class="seg-mini" role="group" aria-labelledby="mb-viewer">
        <button type="button" data-viewer="papa">Папа</button>
        <button type="button" data-viewer="son">Сын</button>
      </div>
    </div>
    <button type="button" class="mb-theme" id="theme-toggle" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg>Ночь</button>
  </header>

  <main class="layout">
    <div class="device" id="device" data-variant="mandarin">
      <div class="app" id="app" data-variant="mandarin"></div>
      <div id="sheet-root"></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <aside class="notes" id="notes" aria-label="Про этот вариант"></aside>
  </main>
</div>

<script src="data.js"></script>
<script src="v-cards.js"></script>
